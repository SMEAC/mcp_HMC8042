[project]
name = "hmc8042-mcp"
version = "0.1.0"
description = "MCP server for the Rohde & Schwarz HMC8042 power supply"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "pyvisa>=1.14",
    "pyvisa-py>=0.7",
]

[project.scripts]
hmc8042-mcp = "hmc8042_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmc8042_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
